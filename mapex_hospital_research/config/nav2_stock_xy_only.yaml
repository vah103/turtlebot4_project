# Minimal Nav2 override for frontier exploration in the Hospital simulation.
#
# Keep TurtleBot4 Nav2 stock behavior except for two simulation-specific needs:
# 1) frontier goals are position-only, so terminal yaw is irrelevant;
# 2) the Hospital Gazebo TB4 command path expects geometry_msgs/msg/Twist,
#    so Nav2 must keep cmd_vel unstamped end-to-end.
#
# The velocity smoother is also raised to the stock MPPI limits requested for
# this experiment: 0.5 m/s linear and 1.9 rad/s angular.

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: false

    general_goal_checker:
      # Keep the stock XY goal tolerance, but make terminal yaw irrelevant.
      yaw_goal_tolerance: 3.141592653589793

    FollowPath:
      # MPPI should not optimize toward the goal pose's arbitrary yaw value.
      GoalAngleCritic:
        enabled: false

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: false

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: false
    max_velocity: [0.5, 0.0, 1.9]
    min_velocity: [-0.5, 0.0, -1.9]

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: false
