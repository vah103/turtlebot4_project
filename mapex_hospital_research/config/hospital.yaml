experiment:
  protocol_version: hospital_v1
  world: hospital_flat
  robot: turtlebot4
  use_sim_time: true
  spawn:
    x: 0.0
    y: 12.0
    yaw: -1.57
  map_resolution_m: 0.05
  goal_timeout_s: 180.0
  stopping_condition: no_reachable_frontier_stable_completion
  random_seed: null

slam:
  launch_or_config: ros2_ws/src/frontier_exploration/config/hospital_slam.yaml

nav2:
  launch_or_config: ros2_ws/src/frontier_exploration/launch/hospital_nav2.launch.py + config/nav2_hospital_override.yaml

sensor:
  lidar_topic: /scan
  max_range_m: 20.0

fixed_logging_canvas:
  id: hospital_canvas_v1
  resolution_m: 0.05
  width_cells: 1504
  height_cells: 2123
  origin_x_m: -25.6
  origin_y_m: -60.1
  frame: slam_start_map
  alignment_rule: reproject every SLAM snapshot onto this fixed grid; never crop dynamically

canonical_evaluation_roi:
  id: hospital_connected_free_v1
  source_or_mask: mapex_hospital_research/ground_truth/hospital/roi_v1.yaml
  alignment_rule: same 0.05 m fixed canvas, origin and SLAM-start frame as hospital_canvas_v1
  valid_cell_rule: 8-connected structural free-space component containing the robot start after wall mesh + flat elevator blockers are rasterized and one-cell cracks are closed
  excluded_cell_rule: obstacles, disconnected free pockets, cells outside fixed Hospital bounds, and fixed-canvas safety padding
  denominator_cells: 215435
  mask_sha256: 05d45b7aba66cb6dbb71e0406005f4a3e21875901af3ae72164b17f1d3add8d1

resource_budget:
  time_s: null
  distance_m: null
  policy: not_a_run_termination_condition_in_hospital_v1; common offline analysis budgets may be chosen after the pilot without changing controller behavior

logging:
  root_dir: mapex_hospital_research/experiments
  save_heavy_artifacts: true
  commit_heavy_artifacts: false
