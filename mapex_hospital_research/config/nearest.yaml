method: nearest_frontier
protocol_version: hospital_v1
implementation:
  source_repository: castacks/MapEx
  source_commit: 53636bd1c79153acc3c74a532837d78c926bae5e
  source_files:
    - scripts/sim_utils.py
    - scripts/explore.py
  ros_adapter: mapex_hospital_research/scripts/mapex_nearest_ros.py
  hospital_runtime_wrapper: mapex_hospital_research/scripts/mapex_nearest_ros_hospital.py
  research_runtime_wrapper: mapex_hospital_research/scripts/mapex_nearest_ros_research.py
  research_navigation_manager: mapex_hospital_research/scripts/exploration_manager_research.py
  recorder: mapex_hospital_research/scripts/research_recorder_safe.py

frontier:
  detector: mapex_official_frontier_rule
  free_cell_rule: occupancy_value_equals_0
  unknown_cell_rule: occupancy_value_less_than_0
  adjacency_to_unknown: 8_neighbor
  region_connectivity: 8
  region_size_threshold_cells: 10
  keep_region_rule: strictly_greater_than_threshold
  representative_rule: region_cell_closest_to_arithmetic_mean_row_col

selection:
  rule: minimum_euclidean_distance_to_frontier_center
  distance_metric: euclidean_grid_distance
  cur_pose_dist_threshold_m: 1.0
  cur_pose_distance_semantics: applied_after_ranking_as_locked_frontier_validity_check
  reject_candidate_when_distance_less_than_m: 1.0
  reject_then_try_next_ranked_candidate: true
  lock_selected_frontier_until_goal_outcome: true
  no_path_rule: remove_current_candidate_and_try_next_lowest_cost

execution_adapter:
  original_mapex_local_planner: pyastar2d_astar_allow_diagonal_false
  hospital_local_planner: nav2_compute_path_to_pose
  hospital_executor: nav2_navigate_to_pose
  frontier_goal_is_shifted_or_standoff: false
  note: Nav2 replaces only the simulator execution layer; frontier generation and ranking remain MapEx nearest semantics.
  source_code_quirk: MapEx base.yaml sets unknown_as_occ=true, but sim_utils.get_inflated_planning_maps() hard-codes unknown_as_occ=False when calling inflate_map. Hospital does not attempt to reproduce this planner-specific inconsistency; both Nearest and MapEx use the same Nav2 execution adapter.

logging:
  exact_decision_map: true
  exact_decision_map_raw_npz: true
  exact_decision_map_fixed_canvas_npz: true
  map_frame_robot_pose_per_decision: true
  all_ranked_candidates: true
  candidate_1m_rejection_status: true
  nav2_path_validation_status: true
  planner_timing_ms: true
  selected_path_length: true
  navigation_result_detail: true
  periodic_map_interval_s: 10.0
  final_map_snapshot: true
  config_sha256_in_metadata: true

navigation:
  goal_timeout_s: 180.0
  stall_timeout_s: 30.0
  use_same_hospital_nav2_stack: true

termination:
  rule: no_planner_reachable_mapex_frontier_stable_completion
  stable_cycles: 5
  check_period_s: 2.0
  min_idle_s: 10.0
  startup_grace_s: 20.0

runs:
  pilot_run_id: nearest_pilot_005
  target_count: 10
  minimum_for_preliminary_analysis: 5
