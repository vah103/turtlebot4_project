method: nearest_frontier
protocol_version: hospital_v2
implementation:
  source_repository: castacks/MapEx
  source_commit: 53636bd1c79153acc3c74a532837d78c926bae5e
  source_files:
    - scripts/sim_utils.py
    - scripts/explore.py
  ros_reference_adapter: mapex_hospital_research/scripts/mapex_nearest_ros.py
  hospital_runtime_wrapper: mapex_hospital_research/scripts/mapex_nearest_ros_hospital.py
  research_runtime_wrapper: mapex_hospital_research/scripts/mapex_nearest_ros_research.py
  hospital_adaptation_wrapper: mapex_hospital_research/scripts/mapex_nearest_ros_hospital_adapted.py
  official_run_wrapper: mapex_hospital_research/scripts/mapex_nearest_ros_official.py
  research_navigation_manager: mapex_hospital_research/scripts/exploration_manager_research.py
  recorder: mapex_hospital_research/scripts/research_recorder_official.py

frontier:
  detector: mapex_official_frontier_rule
  runtime_resolution_m: 0.10
  free_cell_rule: occupancy_value_equals_0
  unknown_cell_rule: occupancy_value_less_than_0
  adjacency_to_unknown: 8_neighbor
  region_connectivity: 8
  region_size_threshold_cells: 10
  keep_region_rule: strictly_greater_than_threshold
  representative_rule: region_cell_closest_to_arithmetic_mean_row_col

selection:
  rule: minimum_euclidean_distance_to_frontier_center
  distance_metric: euclidean_grid_distance
  mapex_original_cur_pose_dist_threshold_m: 1.0
  hospital_enforce_cur_pose_dist_threshold: false
  hospital_distance_adaptation_reason: nearest_pilot_005_startup_deadlock_single_ranked_center_at_0.469m
  below_1m_candidate_rule: keep_rank_and_send_to_nav2_compute_path_to_pose
  lock_selected_frontier_until_goal_outcome: true
  no_path_rule: transient_revalidate_same_ranked_set_before_completion

execution_adapter:
  original_mapex_local_planner: pyastar2d_astar_allow_diagonal_false
  hospital_local_planner: nav2_compute_path_to_pose
  hospital_executor: nav2_navigate_to_pose
  planner_goal_tolerance_m: 0.0
  planner_action_requires_status_succeeded: true
  planner_path_semantics: reachability_evidence_only
  selected_path_length_semantics: planner_validation_path_length_not_executed_trajectory
  navigate_goal_source: exact_frontier_center_xy
  frontier_goal_position_only: true
  frontier_goal_yaw_semantics: ignored_by_hospital_goal_checker
  goal_checker_yaw_tolerance_rad: 3.141592653589793
  goal_angle_critic_enabled: false
  frontier_goal_is_shifted_or_standoff: false
  planner_endpoint_is_execution_goal: false
  planner_revalidation_period_s: 2.0
  execution_failure_suppression_radius_m: 0.25
  execution_failure_cooldown_s: 30.0
  execution_failure_is_permanent: false
  completion_blocked_during_execution_failure_cooldown: true
  source_code_quirk: MapEx base.yaml sets unknown_as_occ=true, but sim_utils.get_inflated_planning_maps() hard-codes unknown_as_occ=false. Hospital does not reproduce this simulator-specific planner inconsistency; Nearest and MapEx use the same Nav2 execution adapter.

mapping_profile:
  runtime_map_resolution_m: 0.10
  evaluation_canvas_resolution_m: 0.05
  nav2_max_linear_speed_mps: 0.45
  nav2_max_angular_speed_radps: 1.0
  slam_minimum_travel_distance_m: 0.10
  slam_minimum_travel_heading_rad: 0.10
  slam_minimum_time_interval_s: 0.15
  slam_max_laser_range_m: 20.0
  loop_closure_thresholds_changed_for_pilot_009: false
  no_loop_ab_profile_matches_active_keyframe_spacing: true

benchmark_clock:
  start_event: first_policy_decision_before_compute
  include_first_decision_compute_time: true
  note: The clock starts after map/TF/Nav2 are ready, immediately before the first frontier candidate computation. The same event must be used by full MapEx so LaMa/visibility/IG cost is included.

logging:
  exact_decision_map: true
  exact_decision_map_raw_npz: true
  exact_decision_map_fixed_canvas_npz: true
  fixed_canvas_reprojection: nearest_neighbor_area_preserving_0.10_to_0.05
  exact_exhausted_no_candidate_state: true
  map_frame_robot_pose_per_decision: true
  all_ranked_candidates: true
  stable_candidate_id: true
  candidate_below_1m_flag: true
  candidate_below_1m_is_rejected: false
  nav2_path_validation_status: true
  nav2_action_status: true
  planner_timing_ms: true
  selected_path_length: true
  planner_endpoint_audit: true
  planner_endpoint_to_frontier_m: true
  exact_execution_goal_audit: true
  goal_yaw_semantics_audit: true
  navigation_result_detail: true
  periodic_map_interval_s: 10.0
  final_map_snapshot: true
  source_and_installed_runtime_sha256_in_metadata: true
  archive_nav2_base_params: true
  archive_effective_merged_nav2_yaml: true
  hash_research_navigation_manager: true
  hash_installed_robot_and_diffdrive_runtime: true

reproducibility:
  simulator_seed_policy: intentionally_uncontrolled_gazebo_default_multiple_run_statistics
  simulator_seed_value: null
  rationale: Gazebo launch currently exposes no fixed seed; variability is handled through repeated runs and the policy is explicitly recorded instead of pretending a seed is fixed.
  official_run_requires_clean_git: true

navigation:
  goal_timeout_s: 180.0
  stall_timeout_s: 30.0
  use_same_hospital_nav2_stack: true
  gridbased_planner_tolerance_m: 0.0
  maximum_linear_speed_mps: 0.45

termination:
  rule: no_planner_reachable_mapex_frontier_stable_completion
  stable_cycles: 5
  check_period_s: 2.0
  min_idle_s: 10.0
  startup_grace_s: 20.0
  nonempty_frontier_requires_planner_revalidation_each_stable_cycle: true
  final_revalidation_sweeps_must_be_consecutive_and_stable: true
  completion_blocked_during_execution_failure_cooldown: true
  exact_terminal_policy_state_required: true

validation:
  data_integrity_checks: true
  experiment_health_checks: true
  success_without_motion_guard: true
  effective_nav2_config_check: true
  terminal_revalidation_audit: true
  complete_runtime_provenance_required: true

runs:
  pilot_run_id: nearest_pilot_010
  target_count: 10
  minimum_for_preliminary_analysis: 5
