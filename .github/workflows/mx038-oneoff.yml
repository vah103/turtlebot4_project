name: MX038 bounded corrective rerun Analyst05

on:
  push:
    branches:
      - mx038-analyst05-bounded-r1r2
    paths:
      - mapex_lab/analysis/mx037_exec.py
      - mapex_lab/analysis/mx037_parallel_exec.py
      - mapex_lab/analysis/mx037_parallel2_exec.py
      - .github/workflows/mx038-oneoff.yml

permissions:
  contents: write

jobs:
  worker:
    strategy:
      fail-fast: false
      matrix:
        run_id:
          - mpx_001
          - mpx_002
          - mpx_003
          - mpx_004
          - mpx_005
          - mpx_006
          - mpx_007
          - mpx_008
          - mpx_009
          - mpx_010
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy scipy matplotlib pyyaml
      - name: Execute bounded-corrected MX037 V2 for one fixed run
        run: python mapex_lab/analysis/mx037_parallel_exec.py worker ${{ matrix.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: mx038-part-${{ matrix.run_id }}
          path: mapex_lab/analysis/mx037_partials
          if-no-files-found: error

  aggregate:
    needs: worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy scipy matplotlib pyyaml
      - uses: actions/download-artifact@v4
        with:
          pattern: mx038-part-*
          path: mapex_lab/analysis/mx037_partials
          merge-multiple: true
      - name: Aggregate frozen ten-run result
        run: python mapex_lab/analysis/mx037_parallel2_exec.py aggregate
      - name: Freeze result candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapex_lab/analysis/mx037_exec_results
          git diff --cached --quiet && { echo "No MX037 result artifacts produced"; exit 1; }
          git commit -m "MX038: freeze bounded-corrected MX037 V2 Analyst05 candidate"
          git push origin HEAD:mx038-analyst05-bounded-r1r2
