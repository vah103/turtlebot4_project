name: MX026 Analyst03 full-trajectory P U R execution

on:
  push:
    branches:
      - mx026-analyst03-exec-v1

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mx026-analyst03-exec-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy matplotlib
      - name: Execute MX026 exact V2 full-trajectory analysis
        run: PYTHONPATH=. python mapex_lab/analysis/mx026_full_trajectory_pur_exec.py
      - name: Commit deterministic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapex_lab/analysis/mx026_exec_results
          git diff --cached --quiet && exit 0
          git commit -m "MX026: record Analyst03 full-trajectory outputs"
          git push origin HEAD:mx026-analyst03-exec-v1
