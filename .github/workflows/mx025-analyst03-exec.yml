name: MX025 Analyst03 bounded map-only R execution

on:
  push:
    branches:
      - mx025-analyst03-exec-v1

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mx025-analyst03-exec-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Execute MX025 exact V2 bounded analysis
        run: PYTHONPATH=. python mapex_lab/analysis/mx025_map_only_r_exec.py
      - name: Commit deterministic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapex_lab/analysis/mx025_exec_results
          git diff --cached --quiet && exit 0
          git commit -m "MX025: record Analyst03 map-only R execution outputs"
          git push origin HEAD:mx025-analyst03-exec-v1
