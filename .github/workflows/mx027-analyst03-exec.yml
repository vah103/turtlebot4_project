name: MX027 Analyst03 deterministic IG coverage execution

on:
  push:
    branches:
      - mx027-analyst03-exec-v1

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mx027-analyst03-exec-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy matplotlib
      - name: Execute MX027 exact V3 deterministic analysis
        run: PYTHONPATH=. python mapex_lab/analysis/mx027_ig_coverage_exec.py
      - name: Commit deterministic outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapex_lab/analysis/mx027_exec_results
          git diff --cached --quiet && exit 0
          git commit -m "MX027: record Analyst03 IG coverage outputs"
          git push origin HEAD:mx027-analyst03-exec-v1
