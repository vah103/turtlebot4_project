name: Materialize LaMa samples

on:
  push:
    branches:
      - agent/add-lama-map-snapshots
    paths:
      - data/lama_samples/.materialize-request

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add pinned LaMa upstream submodule
        env:
          LAMA_COMMIT: 786f5936b27fb3dacd2b1ad799e4de968ea697e7
        run: |
          git submodule add https://github.com/advimman/lama.git third_party/lama_upstream
          git -C third_party/lama_upstream checkout "$LAMA_COMMIT"

      - name: Materialize sample image blobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          jq -c '.images[]' data/lama_samples/blob_manifest.json |
          while read -r item; do
            path="$(jq -r '.path' <<<"$item")"
            blob_sha="$(jq -r '.blob_sha' <<<"$item")"
            expected_sha256="$(jq -r '.sha256' <<<"$item")"
            mkdir -p "$(dirname "$path")"
            gh api "repos/${GH_REPO}/git/blobs/${blob_sha}" --jq '.content' |
              tr -d '\n' | base64 --decode > "$path"
            echo "${expected_sha256}  ${path}" | sha256sum --check --strict
          done

      - name: Commit submodule and samples
        run: |
          git add -- .gitmodules third_party/lama_upstream data/lama_samples
          git commit -m "Add pinned LaMa source and representative samples"
          git push origin "HEAD:${GITHUB_REF_NAME}"
