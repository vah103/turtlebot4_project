name: MX040 Stage-A predictive utility Analyst05

on:
  push:
    branches:
      - mx040-analyst05-exec-v1
    paths:
      - mapex_lab/analysis/.mx040_exec.py.gz.b64.part*
      - .github/workflows/mx040-oneoff.yml

permissions:
  contents: write

jobs:
  worker:
    strategy:
      fail-fast: false
      matrix:
        run_id:
          - mpx_001
          - mpx_002
          - mpx_003
          - mpx_004
          - mpx_005
          - mpx_006
          - mpx_007
          - mpx_008
          - mpx_009
          - mpx_010
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy scipy matplotlib pyyaml
      - name: Materialize reviewed MX040 execution source
        run: cat mapex_lab/analysis/.mx040_exec.py.gz.b64.part* | base64 -d | gunzip > mapex_lab/analysis/mx040_exec.py
      - name: Syntax check
        run: python -m py_compile mapex_lab/analysis/mx040_exec.py
      - name: Build frozen targets/features for one run
        run: python mapex_lab/analysis/mx040_exec.py worker ${{ matrix.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: mx040-part-${{ matrix.run_id }}
          path: mapex_lab/analysis/mx040_partials/${{ matrix.run_id }}
          if-no-files-found: error

  aggregate:
    needs: worker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy scipy matplotlib pyyaml
      - name: Materialize reviewed MX040 execution source
        run: cat mapex_lab/analysis/.mx040_exec.py.gz.b64.part* | base64 -d | gunzip > mapex_lab/analysis/mx040_exec.py
      - uses: actions/download-artifact@v4
        with:
          pattern: mx040-part-*
          path: mapex_lab/analysis/mx040_partials
          merge-multiple: false
      - name: Normalize downloaded run partials
        run: |
          for d in mapex_lab/analysis/mx040_partials/mx040-part-*; do
            run="${d##*mx040-part-}"
            mkdir -p "mapex_lab/analysis/mx040_partials/${run}"
            cp -a "$d/." "mapex_lab/analysis/mx040_partials/${run}/"
          done
      - name: Aggregate exact Method R1 Stage-A result
        run: python mapex_lab/analysis/mx040_exec.py aggregate
      - name: Freeze exact technical candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm mapex_lab/analysis/.mx040_exec.py.gz.b64.part*
          git add mapex_lab/analysis/mx040_exec.py mapex_lab/analysis/mx040_exec_results
          test "$(find mapex_lab/analysis/mx040_exec_results -maxdepth 1 -type f | wc -l)" -eq 16
          git commit -m "MX040: freeze MX039 Stage-A Analyst05 result candidate"
          git push origin HEAD:mx040-analyst05-exec-v1
