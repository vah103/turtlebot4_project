name: MX027 Analyst03 bounded figure R2 correction

on:
  push:
    branches:
      - mx027-analyst03-r2-figures

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mx027-analyst03-r2-figures
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install figure dependencies
        run: python -m pip install --disable-pip-version-check numpy matplotlib
      - name: Apply MX027 figure-only R2 correction
        run: PYTHONPATH=. python mapex_lab/analysis/mx027_result_r2_figure_patch.py
      - name: Commit bounded corrected outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapex_lab/analysis/mx027_exec_results
          git diff --cached --quiet && exit 0
          git commit -m "MX027 R2: correct figure unit separation"
          git push origin HEAD:mx027-analyst03-r2-figures
