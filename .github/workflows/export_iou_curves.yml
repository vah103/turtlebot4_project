name: Export IoU Curves

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export_iou_curves.yml'
      - 'mapex_lab/experiments/nearest/nf_*/evaluation.csv'
      - 'mapex_lab/experiments/mapex/mpx_*/evaluation.csv'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate common-support IoU curves
        shell: bash
        run: |
          python3 - <<'PY'
          import bisect
          import csv
          import json
          import math
          import statistics
          from pathlib import Path

          ROOT = Path('mapex_lab/experiments')
          SOURCE_COMMIT = '7bc6d6de856a51ddb4d9489d14c73bae2cb76871'

          def load_run(path):
              rows = []
              with path.open(newline='') as f:
                  for r in csv.DictReader(f):
                      if r.get('prediction_source') != 'alltrain':
                          raise RuntimeError(f'{path}: non-alltrain row at decision {r.get("decision_id")}')
                      rows.append((float(r['time_s']), float(r['distance_m']), float(r['occupied_iou'])))
              if not rows:
                  raise RuntimeError(f'{path}: no evaluation rows')
              return rows

          def dedupe_last(points):
              # Preserve the last saved prediction when the x-axis value repeats.
              d = {}
              for x, y in points:
                  d[x] = y
              xs = sorted(d)
              return xs, [d[x] for x in xs]

          def interp(xs, ys, x):
              if x < xs[0] or x > xs[-1]:
                  raise ValueError('extrapolation requested')
              i = bisect.bisect_right(xs, x) - 1
              if xs[i] == x or i == len(xs) - 1:
                  return ys[i]
              x1, x2 = xs[i], xs[i + 1]
              y1, y2 = ys[i], ys[i + 1]
              return y1 + (x - x1) * (y2 - y1) / (x2 - x1)

          runs = {'NF': [], 'MapEx': []}
          for i in range(1, 11):
              runs['NF'].append(load_run(ROOT / 'nearest' / f'nf_{i:03d}' / 'evaluation.csv'))
              runs['MapEx'].append(load_run(ROOT / 'mapex' / f'mpx_{i:03d}' / 'evaluation.csv'))

          def build(axis_index, step):
              # axis_index: 0=time, 1=distance in each (time,distance,iou) tuple.
              prepped = {}
              maxima = []
              for method, method_runs in runs.items():
                  prepped[method] = []
                  for run in method_runs:
                      xs, ys = dedupe_last([(r[axis_index], r[2]) for r in run])
                      prepped[method].append((xs, ys))
                      maxima.append(xs[-1])
              common_max = min(maxima)
              grid_max = math.floor((common_max + 1e-12) / step) * step
              grid = [k * step for k in range(int(round(grid_max / step)) + 1)]
              out = []
              for x in grid:
                  row = {'x': x}
                  for method in ('NF', 'MapEx'):
                      vals = [interp(xs, ys, x) for xs, ys in prepped[method]]
                      row[f'{method}_mean'] = statistics.fmean(vals)
                      row[f'{method}_std'] = statistics.stdev(vals)
                      row[f'{method}_n'] = len(vals)
                  out.append(row)
              return common_max, grid_max, out

          common_time, grid_time, time_rows = build(0, 10.0)
          common_dist, grid_dist, dist_rows = build(1, 5.0)

          outdir = ROOT / 'analysis'
          outdir.mkdir(parents=True, exist_ok=True)

          def write_csv(path, x_name, rows):
              with path.open('w', newline='') as f:
                  w = csv.writer(f)
                  w.writerow([x_name, 'NF Mean', 'NF Std', 'NF N', 'MapEx Mean', 'MapEx Std', 'MapEx N'])
                  for r in rows:
                      w.writerow([
                          f"{r['x']:.9f}",
                          f"{r['NF_mean']:.9f}", f"{r['NF_std']:.9f}", r['NF_n'],
                          f"{r['MapEx_mean']:.9f}", f"{r['MapEx_std']:.9f}", r['MapEx_n'],
                      ])

          write_csv(outdir / 'iou_vs_time.csv', 'Time (s)', time_rows)
          write_csv(outdir / 'iou_vs_distance.csv', 'Distance (m)', dist_rows)
          metadata = {
              'source_commit': SOURCE_COMMIT,
              'prediction_source': 'alltrain',
              'runs_per_method': 10,
              'interpolation': 'linear between saved decision checkpoints',
              'extrapolation': False,
              'std': 'sample standard deviation (n-1)',
              'time_step_s': 10.0,
              'distance_step_m': 5.0,
              'common_max_time_s_exact': common_time,
              'time_grid_max_s': grid_time,
              'common_max_distance_m_exact': common_dist,
              'distance_grid_max_m': grid_dist,
          }
          (outdir / 'iou_curves_metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          print(json.dumps(metadata, indent=2))
          PY

      - name: Commit generated curve data
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mapex_lab/experiments/analysis/iou_vs_time.csv \
                  mapex_lab/experiments/analysis/iou_vs_distance.csv \
                  mapex_lab/experiments/analysis/iou_curves_metadata.json
          if git diff --cached --quiet; then
            echo 'No curve changes to commit.'
          else
            git commit -m 'Generate alltrain IoU comparison curves'
            git push origin HEAD:main
          fi
