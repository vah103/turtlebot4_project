name: Normalize runtime profile name

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/normalize_runtime_profile_name.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize runtime_profile_name to slam
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = list(Path('mapex_lab/experiments/nearest').glob('nf_*/summary.json'))
          paths += list(Path('mapex_lab/experiments/mapex').glob('mpx_*/summary.json'))

          changed = []
          for path in sorted(paths):
              data = json.loads(path.read_text())
              if data.get('runtime_profile_name') != 'slam':
                  data['runtime_profile_name'] = 'slam'
                  path.write_text(json.dumps(data, indent=2) + '\n')
                  changed.append(str(path))
          print(f'changed {len(changed)} files')
          for p in changed:
              print(p)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mapex_lab/experiments/nearest/*/summary.json mapex_lab/experiments/mapex/*/summary.json
          git commit -m 'Normalize experiment runtime profile name to slam'
          git push
