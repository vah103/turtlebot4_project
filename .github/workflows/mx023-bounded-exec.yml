name: MX023 bounded execution support

on:
  push:
    branches:
      - mx023-bounded-exec-support-v1

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mx023-bounded-exec-support-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy matplotlib pyyaml
      - name: Run MX023 bounded support
        run: python mapex_lab/analysis/mx023_bounded_exec.py
      - name: Commit deterministic outputs to execution branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mapex_lab/analysis/mx023_exec_results
          git diff --cached --quiet && exit 0
          git commit -m "MX023: record bounded execution support outputs"
          git push origin HEAD:mx023-bounded-exec-support-v1
