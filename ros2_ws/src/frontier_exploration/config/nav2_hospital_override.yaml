# Hospital-world Nav2 overrides.
# This file is merged on top of the installed ROS 2 Jazzy
# nav2_bringup/params/nav2_params.yaml by hospital_nav2.launch.py.
# Keep cmd_vel UNSTAMPED end-to-end because the Gazebo TB4 bridge subscribes
# to geometry_msgs/msg/Twist on /cmd_vel.

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: false
    FollowPath:
      # Maximum forward speed generated by the MPPI controller.
      vx_max: 0.8

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: false

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: false
    # Keep the smoother from clipping the controller back to the Jazzy default
    # of 0.5 m/s. Y and angular limits remain unchanged.
    max_velocity: [0.8, 0.0, 2.0]

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: false
