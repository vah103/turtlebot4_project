# Hospital-world Nav2 overrides.
# This file is merged on top of the installed ROS 2 Jazzy
# nav2_bringup/params/nav2_params.yaml by hospital_nav2.launch.py.
# Keep cmd_vel UNSTAMPED end-to-end because the Gazebo TB4 bridge subscribes
# to geometry_msgs/msg/Twist on /cmd_vel.
#
# Hospital has long, repetitive corridors. Mapping stability is prioritized over
# maximum speed, and MapEx frontier semantics are position-only: frontier policy
# chooses an (x,y) cell, not a terminal robot heading.

planner_server:
  ros__parameters:
    GridBased:
      # Candidate validation must reach the exact selected frontier cell rather
      # than accepting the upstream NavFn 0.5 m fallback endpoint.
      tolerance: 0.0

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: false
    controller_frequency: 15.0

    # MapEx frontier centers have no yaw objective. The upstream SimpleGoalChecker
    # requires yaw within 0.25 rad, which silently turned every frontier into an
    # (x,y,yaw=0) task and could leave MPPI nearly stationary near a valid x/y.
    # Keep the normal 0.25 m positional tolerance but make final yaw irrelevant.
    general_goal_checker:
      yaw_goal_tolerance: 3.141592653589793

    FollowPath:
      # Match MPPI's model timestep to the 15 Hz controller period. Keep the
      # rollout horizon near the standard 2.8 s: 42 * 0.0666667 ~= 2.8 s.
      model_dt: 0.0666667
      time_steps: 42

      # Candidate-trajectory visualization is useful interactively but expensive
      # during long autonomous mapping runs.
      visualize: false

      # Conservative Hospital mapping speed for denser scan overlap.
      vx_max: 0.45
      vx_min: -0.12
      vx_std: 0.18
      wz_max: 1.0
      wz_std: 0.25

      batch_size: 1000
      prune_distance: 3.0
      GoalCritic:
        threshold_to_consider: 2.2
      PathFollowCritic:
        threshold_to_consider: 2.2

      # Final goal heading is not part of MapEx/Nearest frontier policy. Disable
      # only the final-angle critic; path-angle/path-follow critics remain active.
      GoalAngleCritic:
        enabled: false

local_costmap:
  local_costmap:
    ros__parameters:
      width: 6
      height: 6

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: false

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: false
    max_velocity: [0.45, 0.0, 1.0]
    max_accel: [0.6, 0.0, 1.5]
    max_decel: [-0.6, 0.0, -1.5]

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: false
