# Hospital-world Nav2 overrides.
# This file is merged on top of the installed ROS 2 Jazzy
# nav2_bringup/params/nav2_params.yaml by hospital_nav2.launch.py.
# Keep cmd_vel UNSTAMPED end-to-end because the Gazebo TB4 bridge subscribes
# to geometry_msgs/msg/Twist on /cmd_vel.
#
# The active Hospital world now uses one continuous flat ground plane, so no
# keepout / costmap-filter region is required.

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: false
    FollowPath:
      # Maximum forward speed generated by the MPPI controller.
      vx_max: 1.5
      # Widen the MPPI forward-velocity sampling distribution so trajectories
      # above the original 0.5 m/s operating region are explored effectively.
      vx_std: 0.5
      # At 56 steps x 0.05 s, the MPPI horizon is 2.8 s. At 1.5 m/s that is
      # about 4.2 m, so retain enough of the global path for the full horizon.
      prune_distance: 5.0
      GoalCritic:
        threshold_to_consider: 4.2
      PathFollowCritic:
        threshold_to_consider: 4.2

local_costmap:
  local_costmap:
    ros__parameters:
      # Nav2 declares width/height as integer parameters. A 10 x 10 m rolling
      # window gives MPPI enough room to score a ~4.2 m forward trajectory.
      width: 10
      height: 10

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: false

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: false
    # Keep the smoother from clipping the controller below the configured vmax.
    # Y and angular limits remain unchanged.
    max_velocity: [1.5, 0.0, 2.0]

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: false
