# Hospital-world Nav2 overrides.
# This file is merged on top of the installed ROS 2 Jazzy
# nav2_bringup/params/nav2_params.yaml by hospital_nav2.launch.py.
# Keep cmd_vel UNSTAMPED end-to-end because the Gazebo TB4 bridge subscribes
# to geometry_msgs/msg/Twist on /cmd_vel.
#
# The active Hospital world uses one continuous flat ground plane, so no
# keepout / costmap-filter region is required.
#
# Hospital has long, repetitive corridors. pilot_008 showed visible map warping
# during a long autonomous run at the previous 0.75 m/s cap.  Keep the same Nav2
# stack and lower the mapping-speed envelope so slam_toolbox receives more
# overlapping geometry per metre; hospital_slam.yaml simultaneously uses denser
# 0.10 m / 0.10 rad scan-graph spacing.

planner_server:
  ros__parameters:
    GridBased:
      # Hospital frontier semantics require the exact selected frontier cell.
      # The upstream TurtleBot4/NavFn profile uses 0.5 m tolerance, which can
      # return a path ending half a metre short and make a near robot appear to
      # have reached the frontier. A candidate that cannot be planned exactly is
      # rejected by the policy and the next ranked candidate is tried instead.
      tolerance: 0.0

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: false
    controller_frequency: 15.0
    FollowPath:
      # Match MPPI's model timestep to the 15 Hz controller period. Keep the
      # rollout horizon near the standard 2.8 s: 42 * 0.0666667 ~= 2.8 s.
      model_dt: 0.0666667
      time_steps: 42

      # Candidate-trajectory visualization is useful interactively but expensive
      # during long autonomous mapping runs. Disable it to improve real-time factor.
      visualize: false

      # Conservative Hospital mapping speed. 0.45 m/s is deliberately below the
      # pilot_008 0.75 m/s cap so scan matching sees denser overlap in repetitive
      # corridors. Angular speed stays at 1.0 rad/s, with SLAM rotational
      # keyframes tightened separately to 0.10 rad.
      vx_max: 0.45
      vx_min: -0.12
      vx_std: 0.18
      wz_max: 1.0
      wz_std: 0.25

      # At 0.45 m/s the ~2.8 s horizon spans ~1.26 m. Keep the reduced sampling
      # workload and local planning footprint used by the stable Hospital stack.
      batch_size: 1000
      prune_distance: 3.0
      GoalCritic:
        threshold_to_consider: 2.2
      PathFollowCritic:
        threshold_to_consider: 2.2

local_costmap:
  local_costmap:
    ros__parameters:
      width: 6
      height: 6

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: false

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: false
    max_velocity: [0.45, 0.0, 1.0]
    max_accel: [0.6, 0.0, 1.5]
    max_decel: [-0.6, 0.0, -1.5]

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: false
