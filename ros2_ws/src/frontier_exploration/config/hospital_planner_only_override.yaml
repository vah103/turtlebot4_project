# Planner-only Hospital test overrides.
# Purpose: validate frontier reachability with Nav2 without Gazebo, SLAM, lidar,
# odometry, controller_server, or behavior_server.

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    GridBased:
      tolerance: 0.0

# Keep only the static map + inflation layers so planner-only tests are not
# affected by live LaserScan/obstacle observations.
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      rolling_window: false
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
