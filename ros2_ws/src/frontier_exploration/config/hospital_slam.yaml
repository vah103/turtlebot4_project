# Hospital-specific slam_toolbox profile for long autonomous mapping runs.
#
# Hospital has long, repetitive corridors, so mapping stability is more important
# than maximum exploration speed.  pilot_008 showed visible long-run map warping
# even though the TF chain was internally consistent while stationary.  Keep the
# standard matcher / loop-closure gates and reduce only the two most direct drift
# drivers: robot speed (in nav2_hospital_override.yaml) and scan-graph spacing.
slam_toolbox:
  ros__parameters:
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02
    map_update_interval: 3.0
    resolution: 0.05
    restamp_tf: false
    min_laser_range: 0.0
    max_laser_range: 20.0
    minimum_time_interval: 0.15
    transform_timeout: 0.30
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # pilot_008 used 0.20 m / 0.20 rad.  In long Hospital corridors that still
    # allowed enough pose error to accumulate into visibly warped walls.  At the
    # 0.45 m/s Hospital mapping cap, 0.10 m produces roughly 4-5 translational
    # keyframes per second while remaining above the 0.15 s time gate.
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.10
    minimum_travel_heading: 0.10
    check_min_dist_and_heading_precisely: true
    scan_buffer_size: 20
    scan_buffer_maximum_scan_distance: 8.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.0

    # Keep the upstream-style loop-closing gates conservative.  We are not
    # loosening loop closures to hide drift; the stability change is denser scan
    # registration plus slower motion so false corridor correspondences are not
    # made easier to accept.
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
