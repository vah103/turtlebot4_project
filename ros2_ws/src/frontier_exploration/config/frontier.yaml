# Optional preprocessing node retained for experiments only.
# The baseline launch does not start it; WFD reads the raw SLAM /map directly.
frontier_map_preprocessor:
  ros__parameters:
    input_map_topic: /map
    output_map_topic: /frontier_map
    robot_frame: base_link
    odom_frame: odom
    gap_fill_radius_m: 0.10
    seed_search_radius_m: 0.50

frontier_detector:
  ros__parameters:
    map_topic: /map
    global_costmap_topic: /global_costmap/costmap
    local_costmap_topic: /local_costmap/costmap
    marker_topic: /frontier_markers
    path_topic: /frontier_selected_path
    selected_frontier_topic: /frontier_selected
    robot_frame: base_link
    odom_frame: odom
    planner_action: /compute_path_to_pose
    planner_id: ""

    # WFD-style reachable frontier extraction on the raw SLAM map.
    min_cluster_size: 5
    segment_radius_m: 0.75
    min_segment_size: 5
    min_selection_distance_m: 0.60

    # Prefer navigation goals deeper inside known-free space before falling back
    # to cells immediately adjacent to the frontier boundary.
    frontier_goal_standoff_m: 0.30

    # Costmap-aware safe free goals near each frontier segment.
    require_global_costmap: true
    costmap_occ_threshold: 65
    costmap_unknown_is_blocked: true

    # Planner startup / transport failures are transient and never prove that a
    # frontier is unreachable.
    planner_retry_period_sec: 1.0
    planner_rejection_retry_limit: 15

    # No-safe-goal costmap results are temporary evidence. Recheck the frontier
    # several times before confirming it unreachable so SLAM/costmap updates get
    # a chance to expose a valid standoff or adjacent free goal.
    costmap_blocked_retry_period_sec: 10.0
    costmap_blocked_max_checks: 4

    # A frontier is confirmed unreachable after all costmap-safe goals fail
    # ComputePathToPose, or after the bounded costmap-blocked checks above remain
    # unresolved. These regions are revalidated after successful exploration.
    unreachable_frontier_radius_m: 0.50

    # Navigation execution failure remains temporary only. Suppress the whole
    # local stall region rather than just one nearly identical frontier point.
    # Repeated failures in the same area escalate 60 -> 120 -> 240 s, capped at
    # 240 s, while never turning an execution failure into permanent unreachable.
    failed_goal_topic: /frontier_failed_goal
    completed_goal_topic: /frontier_completed_goal
    failed_goal_radius_m: 0.90
    failed_goal_cooldown_sec: 60.0
    failed_goal_cooldown_multiplier: 2.0
    failed_goal_cooldown_max_sec: 240.0
    failed_goal_repeat_window_sec: 600.0
    completed_frontier_radius_m: 0.40
    completed_frontier_cooldown_sec: 15.0
    post_goal_settle_sec: 1.0

    # End only when no reachable frontier remains. Raw frontier geometry may
    # still exist if every remaining region has been planner-confirmed unreachable.
    completion_topic: /exploration_complete
    completion_stable_cycles: 5
    completion_min_idle_sec: 10.0
    completion_check_period_sec: 2.0
    completion_startup_grace_sec: 20.0
    shutdown_on_completion: true
    completion_shutdown_delay_sec: 0.5

exploration_manager:
  ros__parameters:
    path_topic: /frontier_selected_path
    odom_topic: /odom
    navigate_action: /navigate_to_pose
    enable_navigation: false
    retry_period_sec: 1.0
    failed_goal_topic: /frontier_failed_goal
    completed_goal_topic: /frontier_completed_goal

    # Primary progress signal remains Nav2 distance_remaining. Meaningful odometry
    # motion also refreshes the stall timer so rotations/recovery motion are not
    # canceled as false stalls. Thresholds are deliberately above normal jitter.
    stall_timeout_sec: 30.0
    stall_progress_epsilon_m: 0.02
    stall_motion_epsilon_m: 0.08
    stall_rotation_epsilon_rad: 0.35
    stall_odom_max_step_m: 1.0

    # Ultimate guard: even repeated recovery/rotation cannot keep one goal alive
    # forever because this hard timeout does not reset on progress.
    navigation_timeout_sec: 180.0

    # Stop the pathological fail -> cooldown -> new frontier loop when several
    # execution failures occur while the physical odometry pose stays in the same
    # small region. The guard is diagnostic/safety only; it sends no recovery cmd.
    trapped_topic: /robot_trapped
    trapped_failure_limit: 3
    trapped_radius_m: 0.20
