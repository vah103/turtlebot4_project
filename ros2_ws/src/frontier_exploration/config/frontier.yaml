frontier_map_preprocessor:
  ros__parameters:
    input_map_topic: /map
    output_map_topic: /frontier_map
    robot_frame: base_link
    odom_frame: odom
    gap_fill_radius_m: 0.10
    seed_search_radius_m: 0.50

frontier_detector:
  ros__parameters:
    map_topic: /frontier_map
    marker_topic: /frontier_markers
    path_topic: /frontier_selected_path
    robot_frame: base_link
    odom_frame: odom
    planner_action: /compute_path_to_pose
    planner_id: ""
    min_cluster_size: 5
    segment_radius_m: 0.75
    min_segment_size: 5
    min_selection_distance_m: 0.60
    planner_retry_period_sec: 1.0
    planner_rejection_retry_limit: 15
    failed_goal_topic: /frontier_failed_goal
    failed_goal_radius_m: 0.75
    failed_goal_cooldown_sec: 30.0

exploration_manager:
  ros__parameters:
    path_topic: /frontier_selected_path
    navigate_action: /navigate_to_pose
    enable_navigation: false
    goal_repeat_tolerance_m: 0.05
    retry_period_sec: 1.0
    failed_goal_topic: /frontier_failed_goal
    failed_goal_radius_m: 0.75
    failed_goal_cooldown_sec: 30.0
    stall_timeout_sec: 15.0
    stall_progress_epsilon_m: 0.10
    navigation_timeout_sec: 90.0
