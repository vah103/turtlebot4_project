# Minimal Nav2 override for frontier exploration in the Hospital simulation.
#
# Keep TurtleBot4 Nav2 stock behavior except for simulation/frontier-specific needs:
# 1) frontier goals are position-only, so terminal yaw is normally irrelevant;
# 2) the Hospital Gazebo TB4 command path expects geometry_msgs/msg/Twist,
#    so Nav2 must keep cmd_vel unstamped end-to-end;
# 3) reduce MPPI compute load while preserving approximately the same 2.8 s
#    rollout horizon as stock;
# 4) keep MPPI committed to the global path until the robot is genuinely at the
#    end of the path, rather than handing off early just because the goal is
#    Euclidean-close through a wall or around a long detour.
#
# nf_004 A/B test: MPPI trajectory visualization and GoalAngleCritic are
# temporarily re-enabled to evaluate their effect on navigation smoothness.
#
# The velocity smoother uses 0.50 m/s linear and
# 1.9 rad/s angular.

planner_server:
  ros__parameters:
    GridBased:
      # Require a path to the exact frontier instead of accepting a nearby endpoint.
      tolerance: 0.0

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: false

    # Reduce controller demand from stock 20 Hz to 15 Hz.
    controller_frequency: 15.0

    general_goal_checker:
      # Accept frontier goals once the robot is within 0.4 m.
      xy_goal_tolerance: 0.4
      yaw_goal_tolerance: 3.141592653589793

    FollowPath:
      # Preserve ~2.8 s rollout horizon: 42 * 0.0666667 ~= 2.8 s.
      model_dt: 0.0666667
      time_steps: 42

      # Keep the reduced trajectory batch but re-enable visualization for nf_004.
      batch_size: 1000
      visualize: true

      # Do not let Euclidean closeness to the goal switch MPPI away from the
      # global path while a wall forces a long remaining path. The hand-off is
      # delayed until 0.45 m, only slightly outside the 0.4 m goal tolerance.
      GoalCritic:
        enabled: true
        cost_weight: 5.0
        threshold_to_consider: 0.45

      PathFollowCritic:
        enabled: true
        cost_weight: 10.0
        threshold_to_consider: 0.45

      PathAlignCritic:
        enabled: true
        cost_weight: 20.0
        threshold_to_consider: 0.45

      PathAngleCritic:
        enabled: true
        cost_weight: 4.0
        threshold_to_consider: 0.45

      # Re-enabled for the nf_004 navigation smoothness test.
      GoalAngleCritic:
        enabled: true

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: false

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: false
    max_velocity: [0.5, 0.0, 1.9]
    min_velocity: [-0.5, 0.0, -1.9]

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: false
